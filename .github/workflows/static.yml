name: Deploy schema documentation to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/build-schema-docs.mjs"
      - "scripts/check-schema-docs-artifact.mjs"
      - "tests/schema-*.test.mjs"
      - "tests/documentation-*.test.mjs"
      - "src/data-format/schemas/**"
      - "src/data-format/proposals/v2-alpha.1/schemas/**"
      - "src/data-format/generated/bundles/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test schema browser and publication builder
        run: bunx vitest run tests/schema-docs.test.mjs tests/schema-browser-overview.test.mjs tests/schema-overview-image-representation.test.mjs tests/schema-tabs.test.mjs tests/documentation-freshness.test.mjs tests/documentation-worker.test.mjs

      - name: Assemble schema documentation site
        run: node scripts/build-schema-docs.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify Pages artifact identity
        run: node scripts/check-schema-docs-artifact.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
