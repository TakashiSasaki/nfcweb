name: Deploy schema documentation to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "src/data-format/schemas/**"
      - "src/data-format/generated/bundles/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble schema documentation site
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/index.html
          test -f src/data-format/schemas/ndef-record.schema.json
          test -f src/data-format/schemas/nfc-tag.schema.json
          test -f src/data-format/schemas/nfc-tag-registry.schema.json

          rm -rf _site
          mkdir -p _site/schemas/source _site/schemas/bundles

          cp -a docs/. _site/
          cp src/data-format/schemas/*.json _site/schemas/source/
          cp src/data-format/generated/bundles/*.json _site/schemas/bundles/

          # Disable Jekyll processing: this site is already complete static content.
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
